<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASAT - SMK Guna Dharma Nusantara</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .schedule-card { transition: all 0.3s ease; }
    .schedule-card:hover { transform: translateY(-2px); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeInUp 0.5s ease forwards; opacity: 0; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 <script src="/_sdk/telemetry_sdk.js"></script></head>
 <body class="h-full bg-slate-900 text-white overflow-auto">
  <div id="app" class="w-full min-h-full bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900">
   <!-- Header -->
   <header class="w-full py-8 px-4 text-center border-b border-indigo-800/30">
    <div class="max-w-4xl mx-auto">
     <div class="inline-flex items-center gap-2 bg-indigo-500/10 border border-indigo-500/20 rounded-full px-4 py-1.5 mb-4">
      <i data-lucide="graduation-cap" class="w-4 h-4 text-indigo-400"></i> <span id="schoolName" class="text-sm text-indigo-300 font-medium">SMK Guna Dharma Nusantara</span>
     </div>
     <h1 id="headerTitle" class="text-3xl md:text-4xl font-800 bg-gradient-to-r from-white to-indigo-200 bg-clip-text text-transparent">Asesmen Sumatif Akhir Tahun</h1>
     <p class="text-slate-400 mt-3 text-sm">Tahun Pelajaran 2025/2026</p>
     <div id="currentTime" class="mt-4 text-xs text-slate-500 font-mono"></div>
    </div>
   </header><!-- Schedule -->
   <main class="max-w-4xl mx-auto px-4 py-8 space-y-6" id="scheduleContainer"></main><!-- Footer -->
   <footer class="text-center py-6 text-slate-500 text-xs border-t border-indigo-800/20">
    <p>© 2026 SMK Guna Dharma Nusantara. Link soal akan aktif sesuai jadwal.</p>
   </footer>
  </div>
  <script>
    const defaultConfig = {
      school_name: 'SMK Guna Dharma Nusantara',
      header_title: 'Asesmen Sumatif Akhir Tahun',
      primary_color: '#6366f1',
      surface_color: '#1e1b4b',
      text_color: '#e2e8f0',
      accent_color: '#818cf8',
      bg_color: '#0f172a'
    };

    const scheduleData = [
      {
        date: '2026-06-05',
        day: "Jum'at, 5 Juni 2026",
        subjects: [
          { name: 'Pendidikan Agama Islam dan Budi Pekerti', link: 'https://docs.google.com/forms/d/e/1FAIpQLScwdah1ywRwZo4SDMcGGTE6kGhbCsYbqrKQO03fWxk4x_eo-A/viewform?usp=dialog' },
          { name: 'Pendidikan Pancasila', link: 'https://docs.google.com/forms/d/e/1FAIpQLSflcrgfYDyiR-lj-XyDU75cBgYcyKhTKsx-Yn61Ks5UPpzK_A/viewform?usp=dialog' },
          { name: 'Bahasa Indonesia', link: 'https://docs.google.com/forms/d/e/1FAIpQLSciQV2PhpQOT1k7oZQNnfqBHXCMCVz32ZORVXAUl5F8FQN-fw/viewform?usp=dialog' }
        ]
      },
      {
        date: '2026-06-06',
        day: 'Sabtu, 6 Juni 2026',
        subjects: [
          { name: 'Sejarah', link: 'https://docs.google.com/forms/d/e/1FAIpQLScc5eM5452Yi1Rr-bU1hNmI1dzKOthl4GoEGnfplfxdgLiOwg/viewform?usp=dialog' },
          { name: 'Informatika', link: 'https://docs.google.com/forms/d/e/1FAIpQLScuGg93m3BQQ9zpNP1GizmnOXUQQA5RONwOyjlrM3hG5VtLfA/viewform?usp=dialog' },
          { name: 'Projek IPAS', link: 'https://docs.google.com/forms/d/e/1FAIpQLScMNSQLX5gRCznxGHqxajHjWpXNsDVTcPnbe92_J86iHwN76g/viewform?usp=dialog' }
        ]
      },
      {
        date: '2026-06-08',
        day: 'Senin, 8 Juni 2026',
        subjects: [
          { name: 'Matematika', link: 'https://docs.google.com/forms/d/e/1FAIpQLSd4N9E5rAdd1Wu5_hOlcO5NvLLpiY6c0XGk2Uk_MkblTi3RVQ/viewform?usp=publish-editor' },
          { name: 'Bahasa Inggris', link: 'https://docs.google.com/forms/d/e/1FAIpQLSclmRsVxF24weI_KMVLlsAGhWfuirDoSWrs6qTEQM3wJFTE5Q/viewform?usp=dialog' }
        ]
      },
      {
        date: '2026-06-09',
        day: 'Selasa, 9 Juni 2026',
        subjects: [
          { name: 'Produktif TEIN', link: 'https://docs.google.com/forms/d/e/1FAIpQLSe-_A46AYliUviOW9a-N9eRt6owyiioW95fQeqDNYSEtg_duA/viewform?usp=dialog' },
          { name: 'Produktif TKJ', link: 'https://docs.google.com/forms/d/e/1FAIpQLScc732X_w_w-3R0atbTgWQjCYtwW2TgARJ9Or-ZZbNj0l1aEQ/viewform?usp=dialog' },
          { name: 'Produktif Farmasi', link: 'https://docs.google.com/forms/d/e/1FAIpQLSeZo7cJZYlDB09AmagqgeSKvXqGAhwsDsHvsxQG6uU0cL8Iaw/viewform?usp=dialog' },
          { name: 'Koding dan Kecerdasan Artifisial', link: 'https://docs.google.com/forms/d/e/1FAIpQLSc28zJ33WCw8VqXh94zHsmne_jO47qc3vSYTmcp6IBtPAL6HQ/viewform?usp=dialog' },
          { name: 'Bahasa Sunda', link: 'https://docs.google.com/forms/d/e/1FAIpQLSc1aWnM950tD9zkvYrJAEGEKKa35SBk_dbxGNJNvLRmVjbdtw/viewform?usp=dialog' }
        ]
      }
    ];

    function getToday() {
      const now = new Date();
      return now.toISOString().split('T')[0];
    }

    function getStatus(dateStr) {
      return 'open';
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';

      scheduleData.forEach((day, idx) => {
        const status = getStatus(day.date);
        const card = document.createElement('div');
        card.className = `schedule-card animate-in rounded-2xl border overflow-hidden ${
          status === 'open' ? 'border-indigo-500/50 bg-indigo-950/40 shadow-lg shadow-indigo-500/10' :
          status === 'passed' ? 'border-slate-700/30 bg-slate-800/20 opacity-60' :
          'border-slate-700/30 bg-slate-800/30'
        }`;
        card.style.animationDelay = `${idx * 0.1}s`;

        const statusBadge = status === 'open'
          ? '<span class="inline-flex items-center gap-1 bg-emerald-500/20 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-full"><span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>AKTIF</span>'
          : status === 'passed'
          ? '<span class="inline-flex items-center gap-1 bg-slate-500/20 text-slate-400 text-xs font-semibold px-2.5 py-1 rounded-full">SELESAI</span>'
          : '<span class="inline-flex items-center gap-1 bg-amber-500/15 text-amber-400 text-xs font-semibold px-2.5 py-1 rounded-full"><i data-lucide="lock" class="w-3 h-3"></i>TERKUNCI</span>';

        let subjectsHTML = day.subjects.map(sub => {
          if (status === 'open') {
            return `<a href="${sub.link}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3 rounded-xl bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/20 transition-all group">
              <span class="text-sm text-slate-200 font-medium">${sub.name}</span>
              <span class="flex items-center gap-1 text-xs text-indigo-400 group-hover:text-indigo-300 font-semibold whitespace-nowrap ml-3">Kerjakan <i data-lucide="external-link" class="w-3.5 h-3.5"></i></span>
            </a>`;
          } else {
            return `<div class="flex items-center justify-between p-3 rounded-xl bg-slate-800/40 border border-slate-700/20">
              <span class="text-sm text-slate-400 font-medium">${sub.name}</span>
              <span class="text-xs text-slate-500">${status === 'passed' ? 'Selesai' : 'Belum dibuka'}</span>
            </div>`;
          }
        }).join('');

        card.innerHTML = `
          <div class="p-5 md:p-6">
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl ${status === 'open' ? 'bg-indigo-500/20' : 'bg-slate-700/30'} flex items-center justify-center">
                  <i data-lucide="calendar" class="w-5 h-5 ${status === 'open' ? 'text-indigo-400' : 'text-slate-500'}"></i>
                </div>
                <h2 class="font-bold ${status === 'open' ? 'text-white' : 'text-slate-400'}">${day.day}</h2>
              </div>
              ${statusBadge}
            </div>
            <div class="space-y-2.5">${subjectsHTML}</div>
          </div>
        `;
        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('currentTime').textContent = now.toLocaleString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    renderSchedule();
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(renderSchedule, 60000);

    // Element SDK
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        document.getElementById('schoolName').textContent = config.school_name || defaultConfig.school_name;
        document.getElementById('headerTitle').textContent = config.header_title || defaultConfig.header_title;
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          { get: () => config.bg_color || defaultConfig.bg_color, set: (v) => { config.bg_color = v; window.elementSdk.setConfig({ bg_color: v }); } },
          { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
          { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
          { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
          { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } }
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || 'Plus Jakarta Sans', set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ['school_name', config.school_name || defaultConfig.school_name],
        ['header_title', config.header_title || defaultConfig.header_title]
      ])
    });

    lucide.createIcons();
  </script>
